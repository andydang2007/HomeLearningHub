<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Learning Hub</title>
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/240/paper-plane.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="container" id="main-container">

    <!-- Always-visible top navigation -->
    <div class="top-nav">
        <button class="top-nav-btn lang-toggle" id="lang-toggle" aria-label="Switch language">中文</button>
        <a class="top-nav-btn parent-login-btn" href="../parent/index.html" data-i18n="index.parent_login">🔒 Parent</a>
    </div>

    <div id="school-term-display"></div>

    <!-- User picker / name gate (JS renders content dynamically) -->
    <div id="user-screen" class="screen is-hidden">
        <!-- populated by buildUserScreen() -->
    </div>

    <!-- Child PIN gate (3 digits) -->
    <div id="kid-pin-screen" class="screen is-hidden">
        <div class="kid-pin-header">
            <div class="kid-pin-avatar" id="kid-pin-avatar">🌟</div>
            <h2 class="kid-pin-title" id="kid-pin-title" data-i18n="index.child_pin_title">Enter your PIN</h2>
            <p class="kid-pin-subtitle" id="kid-pin-subtitle" data-i18n="index.child_pin_subtitle">3-digit PIN</p>
        </div>
        <div class="kid-pin-dots" id="kid-pin-dots">
            <div class="kid-pin-dot" id="kid-dot-0"></div>
            <div class="kid-pin-dot" id="kid-dot-1"></div>
            <div class="kid-pin-dot" id="kid-dot-2"></div>
        </div>
        <p class="kid-pin-msg" id="kid-pin-msg"></p>
        <input class="kid-pin-hidden-input" type="tel" id="kid-pin-input"
               maxlength="3" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        <div class="kid-pin-keypad" id="kid-pin-keypad">
            <button type="button" class="kid-pin-key" data-digit="1">1</button>
            <button type="button" class="kid-pin-key" data-digit="2">2</button>
            <button type="button" class="kid-pin-key" data-digit="3">3</button>
            <button type="button" class="kid-pin-key" data-digit="4">4</button>
            <button type="button" class="kid-pin-key" data-digit="5">5</button>
            <button type="button" class="kid-pin-key" data-digit="6">6</button>
            <button type="button" class="kid-pin-key" data-digit="7">7</button>
            <button type="button" class="kid-pin-key" data-digit="8">8</button>
            <button type="button" class="kid-pin-key" data-digit="9">9</button>
            <div class="kid-pin-key kid-pin-key-blank"></div>
            <button type="button" class="kid-pin-key" data-digit="0">0</button>
            <button type="button" class="kid-pin-key kid-pin-key-del" id="kid-pin-del">⌫</button>
        </div>
        <button type="button" class="btn-action" id="kid-pin-cancel-btn" data-i18n="index.back_profiles">← Back</button>
    </div>

    <!-- Main dashboard -->
    <div id="dashboard-screen" class="screen">

        <div class="dashboard-header">
            <div class="avatar-row">
                <button class="avatar avatar-btn" id="dash-avatar-btn" type="button" aria-label="Change avatar">
                    <div class="avatar" id="dash-avatar">👱‍♀️</div>
                </button>
                <div class="name-level-stack">
                    <h2 id="dash-name">Hello!</h2>
                </div>
            </div>
            <div class="dashboard-header-right">
                <button class="level-chip" id="level-chip" type="button" title="Open Forge">
                    <span id="level-chip-emoji">🥉</span>
                    <span id="level-chip-text">Level 1</span>
                </button>
                <div class="streak-info-box">
                    <div class="streak-badge pending" id="dash-streak"></div>
                </div>
            </div>
        </div>

        <div class="section-title" data-i18n="index.select_subject">Select Subject</div>
        <div class="grid-cards">
            <button class="card-btn eng" data-action="english-menu" type="button">
                <span class="emoji">🔤</span>
                <span>English</span>
            </button>
            <button class="card-btn math" data-subject="Math" type="button">
                <span class="emoji">🔢</span>
                <span>Math</span>
            </button>
            <button class="card-btn cn" data-action="chinese-menu" type="button">
                <span class="emoji" id="cn-emoji">🐼</span>
                <span id="cn-label" data-i18n="index.subject_cn_short">华文</span>
            </button>
            <button class="card-btn sci" data-subject="Science" type="button">
                <span class="emoji">🌱</span>
                <span>Science</span>
            </button>
        </div>

        <div class="honor-wall">
            <h3 class="honor-wall-heading">
                <div class="honor-wall-heading-left">
                    <span data-i18n="index.badges_title">🏆 My Badges</span>
                    <div class="total-trophies">
                        <span data-i18n="index.badge_total_label">Total:</span>
                        <span class="total-number" id="total-badge-count">0</span>
                    </div>
                </div>
                <button class="shop-btn" id="shop-btn" type="button" data-i18n="index.shop_btn">🎁 Mystery Shop</button>
            </h3>
            <div class="badges-container" id="badges-container"></div>
        </div>

        <button class="btn-action switch-user-btn" id="switch-user-btn" type="button" data-i18n="index.switch_user">👤 Switch User</button>
    </div>

    <!-- Avatar picker modal (student index only) -->
    <div class="avatar-modal-overlay is-hidden" id="avatar-modal">
        <div class="avatar-modal-card">
            <div class="avatar-modal-title" data-i18n="index.avatar_picker_title">Choose Avatar</div>
            <div class="avatar-grid" id="avatar-grid"></div>
            <button type="button" class="btn-action" id="avatar-modal-close" data-i18n="index.close">Close</button>
        </div>
    </div>

    <!-- English submenu -->
    <div id="english-menu" class="screen is-hidden">
        <h2 class="submenu-title">🔤 English Modes</h2>
        <div class="menu-row">
            <button class="menu-btn menu-btn--eng" data-subject="English" type="button">
                <span class="emoji">🚀</span> Practice
            </button>
            <button class="menu-btn menu-btn--eng" data-link="../_legacy_backup/subjects/english/spelling.html" type="button">
                <span class="emoji">✍️</span> Spelling
            </button>
        </div>
        <button class="btn-action back-hub-btn" data-screen="dashboard-screen" type="button" data-i18n="index.back_hub">← Back to Hub</button>
    </div>

    <!-- Chinese submenu -->
    <div id="chinese-menu" class="screen is-hidden">
        <h2 class="submenu-title" data-i18n="index.cn_practice">🐼 Chinese Practice</h2>
        <div class="menu-row">
            <button class="menu-btn menu-btn--cn" data-subject="华文" type="button">
                <span class="emoji">📝</span>
                <span data-i18n="index.cn_review">Review</span>
            </button>
            <button class="menu-btn menu-btn--cn" data-link="../_legacy_backup/subjects/chinese/tingxie.html" type="button">
                <span class="emoji">✍️</span>
                <span data-i18n="index.cn_tingxie">Dictation</span>
            </button>
            <button class="menu-btn menu-btn--cn" data-link="../_legacy_backup/subjects/chinese/pinyin/pinyin.html" type="button">
                <span class="emoji">🎮</span>
                <span data-i18n="index.cn_pinyin">Pinyin Game</span>
            </button>
        </div>
        <button class="btn-action back-hub-btn" data-screen="dashboard-screen" type="button" data-i18n="index.back_hub_cn">← Back to Hub</button>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../common/js/supabase-client.js"></script>
<script src="../common/js/i18n.js"></script>
<script src="../common/js/profile-catalog.js"></script>
<script src="../common/js/auth.js"></script>
<script src="index.js"></script>
</body>
</html>
